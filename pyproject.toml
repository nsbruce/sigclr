[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sigclr"
# ignore this, version is set at build time by poetry-dynamic-versioning
version = "0.0.0"
description = ""
authors = [
    "Nicholas Bruce <nicholas.bruce@nrc-cnrc.gc.ca>",
    "Belaid Moa <bmoa@uvic.ca>",
]
# the directory (or directories) containing the project source files
packages = [
    { include = "sigclr" },
]
classifiers = [
    "Typing :: Typed"
]
license = "AGPL-3.0-or-later"

[tool.poetry.dependencies]
python = "^3.12"
torchsig = {git = "https://github.com/TorchDSP/torchsig.git", rev = "v0.6.0"}
# torch = { file = "/cvmfs/soft.computecanada.ca/custom/python/wheelhouse/gentoo/avx2/torch-2.3.1+computecanada-cp311-cp311-linux_x86_64.whl" }
lightning = {extras = ["extras"], version = "^2.4.0"}
plotly = "^5.24.1"
kaleido = "0.2.1"

[tool.poetry.group.dev]
# optional dependencies only used for development and testing
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
flake8 = "^7.1.1"
mypy = "^1.11.2"
isort = "^5.13.2"
tensorboard = "^2.18.0"
tensorboardx = "^2.6.2.2"

[tool.pytest.ini_options]
testpaths = "tests"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
plugins = "numpy.typing.mypy_plugin"

[tool.black]
target-version = ["py312"]
preview=true

[tool.isort]
profile="black"

